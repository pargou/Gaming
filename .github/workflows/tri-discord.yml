name: Tri des screens Discord

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures (gratuit pour un dépôt public)
  workflow_dispatch:        # bouton « Run workflow » sur GitHub
  push:                     # « lance le tri » demandé à Claude : il modifie ce fichier
    paths:
      - "_bot/lancer.txt"

permissions:
  contents: write

concurrency:
  group: tri-discord
  cancel-in-progress: false

jobs:
  tri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pillow (miniatures)
        run: pip install pillow

      - name: Récupérer et trier les images
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python scripts/sync_discord.py

      - name: Battement de cœur mensuel (évite la mise en pause après 60 jours sans activité)
        run: date -u +%Y-%m > _bot/battement.txt

      - name: Enregistrer les nouvelles images
        run: |
          git config user.name "Archiviste Discord"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Nouvelles images depuis Discord"
            git pull --rebase -q
            git push
          fi
